readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.6",
    "pillow>=12.2.0",
    "pyopencl>=2026.1.2",
    "rawler-py>=0.1.2",
    "torch>=2.12.0",
    "kornia-rs>=0.1.15rc5",
    "tqdm>=4.70.0",
    "matplotlib>=3.11.1",
    "pyqt6>=6.11.0",
    "exifread>=3.5.1",
    "rawpy>=0.28.0",
    "opencv-python>=5.0.0.93",
    "torchmetrics>=1.9.0",
    "termcolor>=3.3.0",
    "strip-ansi>=0.1.1",
]
